---
apiVersion: v1
kind: Service
metadata:
  name: bind9-service
  labels:
    app: bind9
spec:
  selector:
    app: bind9
  ports:
  - protocol: TCP
    port: 5353
    targetPort: 53
    name: bind9-tcp
  - protocol: UDP
    port: 5353
    targetPort: 53
    name: bind9
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bind9-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bind9
  template:
    metadata:
      labels:
        app: bind9
    spec:
      containers:
      - name: bind9
        image: localhost:32000/bind9:9.20-26.04
        env:
        volumeMounts:
        - name: rndc-key
          mountPath: /etc/bind/rndc.key
          subPath: rndc.key
          readOnly: true
        ports:
        - containerPort: 53
          protocol: TCP
        - containerPort: 53
          protocol: UDP
      volumes:
      - name: rndc-key
        secret:
          secretName: bind9-rndc-key
