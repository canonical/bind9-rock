---
apiVersion: v1
kind: Service
metadata:
  name: bind9-service
  labels:
    app: bind9
spec:
  selector:
    app: bind9
  ports:
  - protocol: TCP
    port: 5353
    targetPort: 53
    name: bind9-tcp
  - protocol: UDP
    port: 5353
    targetPort: 53
    name: bind9
---
# used for the rndc test with DNS
apiVersion: v1
kind: Service
metadata:
  name: bind9-headless
  labels:
    app: bind9
spec:
  clusterIP: None  # headless. name = pod IP
  selector:
    app: bind9
  ports:
  - protocol: TCP
    port: 53
    targetPort: 53
    name: bind9-tcp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bind9-rndc
data:
  rndc.key: |
    key "rndc-key" {
        algorithm hmac-sha256;
        secret "imNotARealSecretffffffffffffffffffffffffffff";
    };
  named.conf.local: |
    include "/etc/bind/rndc.key";
    controls {
        inet 0.0.0.0 port 953 allow { any; } keys { "rndc-key"; };
    };
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bind9-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bind9
  template:
    metadata:
      labels:
        app: bind9
    spec:
      containers:
      - name: bind9
        image: bind9:9.20
        env:
        ports:
        - containerPort: 53
          protocol: TCP
        - containerPort: 53
          protocol: UDP
        
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: true
          capabilities:
            add:
              - NET_BIND_SERVICE
              - NET_ADMIN
          seccompProfile:
            type: Unconfined
        volumeMounts:
        - name: rndc
          mountPath: /etc/bind/rndc.key
          subPath: rndc.key
        - name: rndc
          mountPath: /etc/bind/named.conf.local
          subPath: named.conf.local
      volumes:
      - name: rndc
        configMap:
          name: bind9-rndc
