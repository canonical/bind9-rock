name: bind9
version: "9.20"

summary: BIND9, Internet Domain Name Server
description: |
  BIND 9 provides software for Domain Name System (DNS) management including
  both defining domain names authoritatively for a given DNS zone, and
  recursively resolving domain names to their IP addresses.

base: bare
# TODO change to 26.04 once 26.04 is officially released
build-base: devel

platforms:
  amd64:
  arm64:
  ppc64el:
  s390x:

services:
  dns-server:
    override: replace
    command: /usr/local/bin/start-bind9.sh
    startup: enabled

environment:
  BIND9_USER: bind
  USE_CONFIG_FILE_LOGGING: "false"

parts: 
  bind9:
    plugin: nil
    source-type: git
    source-branch: 26.04/bind9
    source: https://github.com/alesancor1/chisel-releases.git
    override-build: |
        chisel cut --release ./ --ignore=unstable --root ${CRAFT_PART_INSTALL} \
            base-files_base \
            base-files_chisel \
            base-files_release-info \
            base-passwd_data \
            bind9_bins \
            bind9-utils_bins \
            tzdata_zoneinfo
    # TODO Once https://github.com/canonical/chisel-releases/pull/963/changes
    # is merged, we can uncomment the stage-packages and remove the override-build
    # stage-packages:
    #   - base-files_base
    #   - base-files_chisel
    #   - base-files_release-info
    #   - base-passwd_data
    #   - bind9_bins
    #   - bind9-utils_bins
    #   - tzdata_zoneinfo
    override-prime: |
        craftctl default

        # Create rndc key
        mkdir -p ${CRAFT_PRIME}/dev && touch ${CRAFT_PRIME}/dev/null
        chroot ${CRAFT_PRIME} rndc-confgen -a
        rm -rf ${CRAFT_PRIME}/dev

        # Create bind user and group
        groupadd --root ${CRAFT_PRIME} -g 9970 bind
        useradd --root ${CRAFT_PRIME} -d /var/cache/bind -g bind -u 9970 bind

        # Set permissions for bind user and group
        chown 9970:9970 ${CRAFT_PRIME}/etc/bind/rndc.key
        chgrp 9970 ${CRAFT_PRIME}/etc/bind
        chmod g+s ${CRAFT_PRIME}/etc/bind
        chgrp 9970 ${CRAFT_PRIME}/etc/bind/rndc.key ${CRAFT_PRIME}/var/cache/bind
        chgrp 9970 ${CRAFT_PRIME}/etc/bind/named.conf*
        chmod g+r ${CRAFT_PRIME}/etc/bind/rndc.key ${CRAFT_PRIME}/etc/bind/named.conf*
        chmod g+rwx ${CRAFT_PRIME}/var/cache/bind

  start-script:
    plugin: dump
    source: .
    source-type: local
    stage-packages:
      - dash_bins
    organize: 
      'start-bind9.sh': usr/local/bin/start-bind9.sh
    stage:
      - usr
    override-prime: |
      craftctl default

      # Set execute permissions on the start script
      chmod +x ${CRAFT_PRIME}/usr/local/bin/start-bind9.sh

  deb-security-manifest:
    plugin: make
    source: https://github.com/canonical/rocks-security-manifest
    source-type: git
    source-branch: main
    override-prime: gen_manifest
