project: bind9:devel

backends:
  craft:
    type: craft
    systems:
      - ubuntu-24.04:
      #- ubuntu-22.04:

suites:
  spread/general/:
    summary: General integration tests

    prepare: |
      sudo snap install docker

      # For 'rockcraft.skopeo'
      sudo snap install --classic rockcraft

      # Wait for docker daemon to come online
      sudo apt install --yes retry
      retry --times=10 --delay 2 -- docker images
      sudo apt remove --yes retry

      # Load the rock into docker
      sudo rockcraft.skopeo --insecure-policy copy "oci-archive:$CRAFT_ARTIFACT" docker-daemon:bind9:devel

    restore: |
      docker image rm --force bind9:devel

  spread/k8s/:
    summary: K8s integration tests

    prepare: |
      # Cilium (CNI) is not yet supported on s390x and ppc64le
      # so we'll skip the k8s tests on those architectures for now
      # ---
      # TODO: Remove this check once Cilium supports s390x and ppc64le
      if [ "$(uname -m)" = "s390x" ] || [ "$(uname -m)" = "ppc64le" ]; then
        echo "Skipping k8s tests on $(uname -m) architecture"
        exit 0
      fi

      # Cleanup containerd
      sudo snap remove docker
      sudo systemctl stop containerd || true
      sudo rm -rf /run/containerd /var/lib/containerd /etc/containerd || true

      sudo snap install k8s --classic

      # Bootstrap k8s and wait for it to be ready
      k8s bootstrap
      k8s status --wait-ready --timeout 15m

      # status --wait-ready returns before cilium finishes programming the coredns
      # backends, so a pod resolving dns in that ~35s window gets EPERM ("couldn't
      # get address"). wait for kube-system to actually settle before the tests.
      # k8sd re-rolls cilium through a helm upgrade right after bootstrap, so a
      # one-shot `kubectl wait pods --all` can latch onto a pod that is about to
      # be deleted and time out on it. follow the controllers instead.
      for obj in daemonset/cilium deployment/cilium-operator deployment/coredns \
                 deployment/metrics-server daemonset/ck-storage-rawfile-csi-node \
                 statefulset/ck-storage-rawfile-csi-controller; do
        timeout 300 bash -c "until k8s kubectl get --namespace kube-system $obj >/dev/null 2>&1; do sleep 2; done"
        k8s kubectl rollout status --namespace kube-system "$obj" --timeout=5m
      done

      # Copy the built image to the local registry
      /snap/k8s/current/bin/ctr --address /run/containerd/containerd.sock -n k8s.io \
        images import --base-name docker.io/library/bind9 $CRAFT_ARTIFACT

    # Runs when prepare fails; debug-each when a task fails. The dump lands on
    # the test host, so a workflow step can upload it as an artefact.
    debug: |
      "$PROJECT_PATH"/spread/k8s/debug.sh /tmp/k8s-debug
    debug-each: |
      "$PROJECT_PATH"/spread/k8s/debug.sh /tmp/k8s-debug

exclude:
  - .git

kill-timeout: 1h
