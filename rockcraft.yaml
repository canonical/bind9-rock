name: bind9
version: "9.20"

summary: BIND9, Internet Domain Name Server
description: |
  BIND 9 provides software for Domain Name System (DNS) management including
  both defining domain names authoritatively for a given DNS zone, and
  recursively resolving domain names to their IP addresses.

base: bare
build-base: ubuntu@26.04
run-user: _daemon_

platforms:
  amd64:
  arm64:
  ppc64el:
  s390x:

services:
  dns-server:
    override: replace
    command: /usr/sbin/named [ -g ]
    startup: enabled

checks:
  config:
    override: replace
    exec:
      command: /usr/bin/named-checkconf
      service-context: dns-server

parts: 
  bind9:
    plugin: nil
    stage-packages:
      - base-files_base
      - base-files_chisel
      - base-files_release-info
      - base-passwd_data
      - bind9_core
      - tzdata_zoneinfo
    override-prime: |
        craftctl default

        # Create bind user and group
        groupadd --root ${CRAFT_PRIME} -g 9970 bind
        useradd --root ${CRAFT_PRIME} -d /var/cache/bind -g bind -u 9970 bind -s /usr/sbin/nologin

        # Add _daemon_ to the bind group by editing the /etc/group file
        sed -i 's/^bind:x:9970:/bind:x:9970:_daemon_/' ${CRAFT_PRIME}/etc/group

        # Set permissions for bind user and group       
        chgrp 9970 ${CRAFT_PRIME}/etc/bind
        chgrp 9970 ${CRAFT_PRIME}/var/cache/bind
        chgrp 9970 ${CRAFT_PRIME}/etc/bind/named.conf*
        
        chmod g+rws ${CRAFT_PRIME}/etc/bind
        chmod g+rwx ${CRAFT_PRIME}/var/cache/bind
        chmod g+r ${CRAFT_PRIME}/etc/bind/named.conf*
